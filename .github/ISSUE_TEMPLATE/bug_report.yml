name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        **Security vulnerabilities must not be reported here** — see the security policy instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands or configuration that trigger the problem.
      placeholder: |
        1. Run `...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, package version or commit SHA you are using.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime versions (Python, Node, …), hardware if relevant.
      placeholder: |
        - OS:
        - Runtime:
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Relevant log output. This is rendered as code, no backticks needed.
      render: shell
